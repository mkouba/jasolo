# jasolo - Java source locator MCP server
#
# Server identity and usage hints shown to MCP clients
quarkus.mcp.server.server-info.description=Locates and reads Java source files of Maven artifacts from local git clones and the local Maven repository.
quarkus.mcp.server.server-info.instructions=jasolo resolves the sources of dependency artifacts given Maven coordinates (groupId:artifactId:version): first a local git clone of the producing project (reading a specific tag or branch, without touching the working copy), then the sources jar in the local Maven repository. It is not intended for files of the project currently being worked on - use the regular file tools for those.
#
# Local git repo roots: directories whose immediate children are cloned git repos,
# e.g. jasolo.git.roots=/home/me/source,/home/me/source/quarkiverse
# Empty by default - the git repo resolver is disabled then.
#jasolo.git.roots=
#
# How sources are read from a git ref: "show" (non-destructive, default)
#jasolo.git.access-mode=show
#
# Ordered ref patterns tried when mapping a GAV version to a git ref.
# Placeholders: {version}, {major}, {minor}
#jasolo.git.ref-patterns={version},v{version},{major}.{minor},{major}.{minor}.x,development/{major}.{minor}
#
# Local Maven repository
#jasolo.maven.local-repo=/home/me/.m2/repository
#
# Fetch missing sources jars on demand via Maven when no resolver can locate
# the sources locally. The executed command is <command> followed by the fixed
# arguments: -B -ntp dependency:get -Dartifact=g:a:v:jar:sources
# -Dtransitive=false -Dmaven.repo.local=<jasolo.maven.local-repo>.
# The command is a comma-separated list (executable + leading arguments),
# e.g. mvnd,--mode=daemon - a wrapper script or an absolute path works too.
#jasolo.maven.fetch.enabled=false
#jasolo.maven.fetch.command=mvn
#
# Caching of located sources jars: max-jars bounds the number of jars kept (LRU),
# max-files bounds the number of cached file contents per jar; 0 disables.
# A cached jar is re-read when it changes on disk (timestamp/size).
#jasolo.maven.cache.max-jars=16
#jasolo.maven.cache.max-files=256

%dev.jasolo.git.roots=${user.home}/source

# Production runs over stdio (mvn package -Dprod): stdout carries the MCP
# protocol and the console log is redirected to stderr automatically
quarkus.banner.enabled=false
# The stdio transport is disabled in tests: the @QuarkusTest tool tests talk
# HTTP and must not consume the stdin/stdout of the test JVM
%test.quarkus.mcp.server.stdio.enabled=false

# Debug logging of the resolver internals (jar cache hits/misses, git ref resolution)
#%dev.quarkus.log.category."com.github.mkouba".level=DEBUG

%dev.quarkus.mcp.server.traffic-logging.enabled=false
%dev.quarkus.mcp.server.traffic-logging.text-limit=5000